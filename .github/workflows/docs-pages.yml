name: Build and deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - overrides/**
      - docs/requirements.txt
      - docs/requirements.lock
      - mkdocs.yml
      - llms.txt
      - tools/check-docs.mjs
      - tools/exact-url.mjs
      - tools/exact-url.test.mjs
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install documentation dependencies
        # The lockfile contains hashes for every direct and transitive wheel.
        # Keep --require-hashes enabled so a changed artifact cannot be trusted
        # merely because its version number is unchanged.
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement docs/requirements.lock

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Validate documentation links and capability references
        run: node tools/check-docs.mjs

      - name: Test exact documentation URL assertions
        run: npm run test:docs

      - name: Build the documentation site
        run: mkdocs build --strict

      - name: Publish llms.txt at the site root
        # llms.txt lives at the repository root (for direct GitHub/npm
        # discovery), not under docs_dir, so mkdocs never picks it up on its
        # own -- copy it into the built site so it is also reachable at
        # https://sythos.github.io/JS_Barcode_Universal/llms.txt for crawlers
        # that check the site root, the conventional location for this file.
        run: cp llms.txt site/llms.txt

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy documentation to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
