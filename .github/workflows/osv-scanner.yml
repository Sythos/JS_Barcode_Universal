name: OSV-Scanner

# Run a complete dependency scan on main and on a weekly schedule. Pull
# request dependency changes are covered by the dedicated Dependency Review
# workflow. The reusable workflow is pinned to an immutable commit and
# requires no third-party account or secret.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '12 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Full dependency scan
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@0c58c542420dfd23fcac08dd9c8ca3cca9c36f1a # v2.5.0
    with:
      scan-args: |-
        --lockfile=./package-lock.json
    permissions:
      actions: read
      contents: read
      security-events: write
