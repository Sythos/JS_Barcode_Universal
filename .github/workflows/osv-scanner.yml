name: OSV-Scanner

# Run a complete dependency scan on main and on a weekly schedule. Pull
# request dependency changes are covered by the dedicated Dependency Review
# workflow. The scanner runs without SARIF upload, so this workflow needs only
# read access and no third-party account or secret. The CLI release asset is
# verified with its published SHA-256 before it is executed.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '12 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Full dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify OSV-Scanner
        shell: bash
        env:
          OSV_SCANNER_SHA256: edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c
        run: |
          set -euo pipefail

          scanner_path="${RUNNER_TEMP}/osv-scanner"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --silent --show-error \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64 \
            --output "${scanner_path}"
          printf '%s  %s\n' "${OSV_SCANNER_SHA256}" "${scanner_path}" \
            | sha256sum --check --strict
          chmod 0755 "${scanner_path}"
          "${scanner_path}" --version

      - name: Scan the npm lockfile with OSV-Scanner
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/osv-scanner" scan source \
            --lockfile=./package-lock.json
