name: Pull request quality

# This gate validates the JavaScript runtime, TypeScript source tree, public
# declarations and package surface without adding runtime dependencies.
on:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript package validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate JavaScript and public package surface
        run: node .github/ci/validate-package.mjs

  typescript:
    name: TypeScript source and declaration validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile TypeScript source and refresh JavaScript output
        run: npm run build:ts

      - name: Ensure generated JavaScript is synchronized
        shell: bash
        run: git diff --exit-code -- src/index.js src/js

      - name: Run public TypeScript declaration checks
        run: >-
          npm run types:api

  package:
    name: npm package contents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify npm package contents
        run: npm pack --dry-run --ignore-scripts --json > npm-pack.json

      - name: Validate artifact attestation workflows
        run: node .github/ci/validate-attestations.mjs

  documentation:
    name: Documentation consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate documentation links and capability references
        run: node tools/check-docs.mjs
