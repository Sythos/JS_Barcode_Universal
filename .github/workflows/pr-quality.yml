name: Pull request quality

# The publish checkout has no package lockfile. This gate validates the
# JavaScript runtime, TypeScript source tree, public declarations and package
# surface without adding runtime dependencies.
on:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript package validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      # No lockfile is published, so npm caching is intentionally omitted.

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          fi

      - name: Validate JavaScript and public package surface
        run: node .github/ci/validate-package.mjs

  typescript:
    name: TypeScript source and declaration validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          fi

      - name: Compile TypeScript source and refresh JavaScript output
        run: npm run build:ts

      - name: Ensure generated JavaScript is synchronized
        shell: bash
        run: git diff --exit-code -- src/index.js src/js

      - name: Run public TypeScript declaration checks
        run: >-
          npm run types:api

  package:
    name: npm package contents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          fi

      - name: Verify npm package contents
        run: npm pack --dry-run --ignore-scripts --json > npm-pack.json
