name: Validate documentation build

on:
  pull_request:
    paths:
      - docs/**
      - overrides/**
      - docs/requirements.txt
      - docs/requirements.lock
      - mkdocs.yml
      - llms.txt
      - tools/check-docs.mjs
      - tools/exact-url.mjs
      - tools/exact-url.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation for review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install documentation dependencies
        # The lockfile contains hashes for every direct and transitive wheel.
        # Keep --require-hashes enabled so a changed artifact cannot be trusted
        # merely because its version number is unchanged.
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement docs/requirements.lock

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Validate documentation links and capability references
        run: node tools/check-docs.mjs

      - name: Test exact documentation URL assertions
        run: npm run test:docs

      - name: Build the documentation site
        run: mkdocs build --strict

      - name: Publish llms.txt at the site root
        # Same copy step as the production deploy workflow (docs-pages.yml),
        # kept here so a PR that breaks it is caught before merge.
        run: cp llms.txt site/llms.txt
