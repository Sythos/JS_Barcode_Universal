name: Publish to GitHub Packages on version bump

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "lib/**"
      - "bundle/**"

permissions:
  contents: read
  packages: write

jobs:
  check-version:
    name: Check package version
    runs-on: ubuntu-latest

    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check version bump
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "No previous commit available. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git show HEAD^:package.json > /tmp/package.previous.json 2>/dev/null; then
            echo "Previous package.json not found. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_VERSION=$(node -p \
            "require('/tmp/package.previous.json').version")

          echo "Previous version: $PREVIOUS_VERSION"

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "Version unchanged. Nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node <<'NODE'
          const previous = require('/tmp/package.previous.json').version;
          const current = require('./package.json').version;

          const semver =
            /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/;

          const oldMatch = previous.match(semver);
          const newMatch = current.match(semver);

          if (!oldMatch || !newMatch) {
            console.error(
              `Invalid SemVer version: ${previous} -> ${current}`
            );
            process.exit(1);
          }

          function compareIdentifiers(a, b) {
            const aNum = /^\d+$/.test(a);
            const bNum = /^\d+$/.test(b);

            if (aNum && bNum) return Number(a) - Number(b);
            if (aNum) return -1;
            if (bNum) return 1;

            return a.localeCompare(b);
          }

          function comparePrerelease(a, b) {
            if (!a && !b) return 0;
            if (!a) return 1;
            if (!b) return -1;

            const aa = a.split('.');
            const bb = b.split('.');
            const length = Math.max(aa.length, bb.length);

            for (let i = 0; i < length; i++) {
              if (aa[i] === undefined) return -1;
              if (bb[i] === undefined) return 1;

              const result = compareIdentifiers(aa[i], bb[i]);

              if (result !== 0) return result;
            }

            return 0;
          }

          function compareVersions(a, b) {
            const am = a.match(semver);
            const bm = b.match(semver);

            for (let i = 1; i <= 3; i++) {
              const diff = Number(am[i]) - Number(bm[i]);

              if (diff !== 0) return diff;
            }

            return comparePrerelease(am[4], bm[4]);
          }

          if (compareVersions(current, previous) <= 0) {
            console.error(
              `Version must increase: ${previous} -> ${current}`
            );
            process.exit(1);
          }

          console.log(`Version increased: ${previous} -> ${current}`);
          NODE

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish GitHub Package
    needs: check-version

    if: needs.check-version.outputs.should_publish == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@sythos"

      - name: Run tests
        run: npm test --if-present

      - name: Run build
        run: npm run build --if-present

      - name: Prepare package name for GitHub Packages
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const packageJsonPath = './package.json';
          const pkg = require(packageJsonPath);

          const originalName = pkg.name;

          if (!originalName) {
            console.error('package.json does not contain a package name.');
            process.exit(1);
          }

          const baseName = originalName.replace(/^@[^/]+\//, '');
          const githubPackageName = `@sythos/${baseName}`;

          pkg.name = githubPackageName;

          fs.writeFileSync(
            packageJsonPath,
            JSON.stringify(pkg, null, 2) + '\n'
          );

          console.log(`Package name: ${originalName} -> ${githubPackageName}`);
          NODE

      - name: Show package metadata
        run: |
          echo "Package:"
          node -p "require('./package.json').name"

          echo "Version:"
          node -p "require('./package.json').version"

      - name: Check whether version already exists
        id: package-check
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION="${{ needs.check-version.outputs.version }}"

          echo "Checking GitHub Packages for $PACKAGE_NAME@$VERSION..."

          if npm view "$PACKAGE_NAME@$VERSION" \
            --registry=https://npm.pkg.github.com \
            version >/dev/null 2>&1; then

            echo "$PACKAGE_NAME@$VERSION already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$PACKAGE_NAME@$VERSION is not published yet."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages
        if: steps.package-check.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --registry=https://npm.pkg.github.com
