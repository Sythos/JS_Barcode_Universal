name: Validate and publish to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-packages-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate JavaScript, TypeScript and package exports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@sythos'

      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run JavaScript source and API checks
        run: node .github/ci/validate-package.mjs

      - name: Compile TypeScript source and refresh JavaScript output
        run: npm run build:ts

      - name: Ensure generated JavaScript is synchronized
        shell: bash
        run: git diff --exit-code -- src/index.js src/js

      - name: Run public TypeScript declaration checks
        run: npm run types:api

      - name: Verify npm package contents
        run: npm pack --dry-run --json > npm-pack.json

  check-version:
    name: Check package version
    needs: validate
    runs-on: ubuntu-latest

    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check version increase
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "No previous commit available. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git show HEAD^:package.json > /tmp/package.previous.json 2>/dev/null; then
            echo "Previous package.json not found. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_VERSION=$(node -p "require('/tmp/package.previous.json').version")
          echo "Previous version: $PREVIOUS_VERSION"

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "Version unchanged. Nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node <<'NODE'
          const previous = require('/tmp/package.previous.json').version;
          const current = require('./package.json').version;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/;
          const oldMatch = previous.match(semver);
          const newMatch = current.match(semver);

          if (!oldMatch || !newMatch) {
            console.error(`Invalid SemVer version: ${previous} -> ${current}`);
            process.exit(1);
          }

          function compareIdentifiers(a, b) {
            const aNum = /^\d+$/.test(a);
            const bNum = /^\d+$/.test(b);
            if (aNum && bNum) return Number(a) - Number(b);
            if (aNum) return -1;
            if (bNum) return 1;
            return a.localeCompare(b);
          }

          function comparePrerelease(a, b) {
            if (!a && !b) return 0;
            if (!a) return 1;
            if (!b) return -1;
            const aa = a.split('.');
            const bb = b.split('.');
            const length = Math.max(aa.length, bb.length);
            for (let i = 0; i < length; i++) {
              if (aa[i] === undefined) return -1;
              if (bb[i] === undefined) return 1;
              const result = compareIdentifiers(aa[i], bb[i]);
              if (result !== 0) return result;
            }
            return 0;
          }

          function compareVersions(a, b) {
            const am = a.match(semver);
            const bm = b.match(semver);
            for (let i = 1; i <= 3; i++) {
              const diff = Number(am[i]) - Number(bm[i]);
              if (diff !== 0) return diff;
            }
            return comparePrerelease(am[4], bm[4]);
          }

          if (compareVersions(current, previous) <= 0) {
            console.error(`Version must increase: ${previous} -> ${current}`);
            process.exit(1);
          }

          console.log(`Version increased: ${previous} -> ${current}`);
          NODE

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish GitHub Package
    needs: [validate, check-version]
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@sythos'

      - name: Show package metadata
        run: |
          node -p "require('./package.json').name"
          node -p "require('./package.json').version"

      - name: Check whether version already exists
        id: package-check
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION="${{ needs.check-version.outputs.version }}"

          if npm view "$PACKAGE_NAME@$VERSION" \
            --registry=https://npm.pkg.github.com \
            version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$PACKAGE_NAME@$VERSION is not published yet."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create publish tarball
        id: pack
        if: steps.package-check.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          npm pack --ignore-scripts --json > npm-pack.json
          PACKAGE_FILE=$(node -e "const fs=require('node:fs'); const result=JSON.parse(fs.readFileSync('npm-pack.json','utf8')); if (!Array.isArray(result) || result.length !== 1 || typeof result[0].filename !== 'string') process.exit(1); process.stdout.write(result[0].filename);")

          test -f "$PACKAGE_FILE"
          echo "filename=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
          echo "Created $PACKAGE_FILE"

      - name: Attest publish tarball
        if: steps.package-check.outputs.exists == 'false'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ github.workspace }}/${{ steps.pack.outputs.filename }}

      - name: Publish exact attested tarball to GitHub Packages
        if: steps.package-check.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "${{ steps.pack.outputs.filename }}" --registry=https://npm.pkg.github.com
