name: Validate and publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish the current version manually when it is not yet on npm
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate JavaScript, TypeScript and package exports
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run JavaScript source and API checks
        run: node .github/ci/validate-package.mjs

      - name: Compile TypeScript source and refresh JavaScript output
        run: npm run build:ts

      - name: Ensure generated JavaScript is synchronized
        shell: bash
        run: git diff --exit-code -- src/index.js src/js

      - name: Run focused format tests
        run: npm run test:formats

      - name: Run core format tests
        run: npm run test:core

      - name: Run foundation module tests
        run: npm run test:foundations

      - name: Run TypeScript compiler checks
        run: npm run types

      - name: Run public TypeScript declaration checks
        run: npm run types:api

      - name: Create validated npm package tarball
        id: package
        shell: bash
        run: |
          set -euo pipefail

          npm pack --ignore-scripts --no-audit --no-fund --json > npm-pack.json
          TARBALL=$(node -p "JSON.parse(require('fs').readFileSync('npm-pack.json', 'utf8'))[0].filename")
          test -n "$TARBALL"
          test -f "$TARBALL"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "Created $TARBALL"
          echo "filename=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload validated npm package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.filename }}
            ${{ steps.package.outputs.filename }}.sha256
          if-no-files-found: error
          retention-days: 7

  check-version:
    name: Check package version
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
      package_name: ${{ steps.version.outputs.package_name }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check version increase
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          echo "Current package: $PACKAGE_NAME"
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_publish }}" == "true" ]]; then
            if npm view "$PACKAGE_NAME@$CURRENT_VERSION" version >/dev/null 2>&1; then
              echo "$PACKAGE_NAME@$CURRENT_VERSION already exists on npm; refusing manual republish."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "Manual publish requested for unpublished $PACKAGE_NAME@$CURRENT_VERSION."
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "No previous commit available. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git show HEAD^:package.json > /tmp/package.previous.json 2>/dev/null; then
            echo "Previous package.json not found. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_VERSION=$(node -p "require('/tmp/package.previous.json').version")
          echo "Previous version: $PREVIOUS_VERSION"

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "Version unchanged. Nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node <<'NODE'
          const previous = require('/tmp/package.previous.json').version;
          const current = require('./package.json').version;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/;
          const oldMatch = previous.match(semver);
          const newMatch = current.match(semver);

          if (!oldMatch || !newMatch) {
            console.error(`Invalid SemVer version: ${previous} -> ${current}`);
            process.exit(1);
          }

          function compareIdentifiers(a, b) {
            const aNum = /^\d+$/.test(a);
            const bNum = /^\d+$/.test(b);
            if (aNum && bNum) return Number(a) - Number(b);
            if (aNum) return -1;
            if (bNum) return 1;
            return a.localeCompare(b);
          }

          function comparePrerelease(a, b) {
            if (!a && !b) return 0;
            if (!a) return 1;
            if (!b) return -1;
            const aa = a.split('.');
            const bb = b.split('.');
            const length = Math.max(aa.length, bb.length);
            for (let i = 0; i < length; i++) {
              if (aa[i] === undefined) return -1;
              if (bb[i] === undefined) return 1;
              const result = compareIdentifiers(aa[i], bb[i]);
              if (result !== 0) return result;
            }
            return 0;
          }

          function compareVersions(a, b) {
            const am = a.match(semver);
            const bm = b.match(semver);
            for (let i = 1; i <= 3; i++) {
              const diff = Number(am[i]) - Number(bm[i]);
              if (diff !== 0) return diff;
            }
            return comparePrerelease(am[4], bm[4]);
          }

          if (compareVersions(current, previous) <= 0) {
            console.error(`Version must increase: ${previous} -> ${current}`);
            process.exit(1);
          }

          console.log(`Version increased: ${previous} -> ${current}`);
          NODE

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish npm package
    needs: [validate, check-version]
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download validated npm package tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: release

      - name: Verify validated npm package digest
        id: package
        shell: bash
        run: |
          set -euo pipefail

          TARBALL=$(find release -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$TARBALL"
          (cd release && sha256sum --check "$(basename "$TARBALL").sha256")
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Verified $TARBALL"

      - name: Check whether version already exists on npm
        id: npm-check
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="${{ needs.check-version.outputs.package_name }}"
          VERSION="${{ needs.check-version.outputs.version }}"

          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION already exists on npm."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$PACKAGE_NAME@$VERSION is not published yet."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest validated npm package
        if: steps.npm-check.outputs.exists == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.tarball }}

      - name: Publish attested npm package
        if: steps.npm-check.outputs.exists == 'false'
        run: npm publish "./${{ steps.package.outputs.tarball }}" --provenance --ignore-scripts
